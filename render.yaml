services:
  - type: web
    name: kept
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: KEPT_PASSCODE
        sync: false
      - key: KEPT_DATA_DIR
        value: /tmp/kept-data
  - type: web
    name: kept-replay
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: KEPT_FAKE_PAYPAL
        value: "1"
      - key: KEPT_PUBLIC_REPLAY
        value: "1"
      - key: KEPT_DATA_DIR
        value: /tmp/kept-replay-data
